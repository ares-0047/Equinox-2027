<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ config.EVENT_NAME }} — {{ config.TAGLINE }}">
    <title>{{ config.EVENT_NAME }} | {{ config.TAGLINE }}</title>
    <meta name="theme-color" content="#f4f0e7">
    <link rel="preload" as="image" href="/equinox-header-logo.png">
    <link rel="preload" as="image" href="/qtm-logo.png">
    <link rel="preload" as="image" href="/qtm-logo.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar" aria-label="Primary navigation">
        <div class="container nav-container">
            <a href="/home#welcome" class="nav-brand nav-brand-logo" aria-label="Equinox 2027 home"><img src="/equinox-header-logo.png" alt="EQUINOX 2027"></a>
            <button class="menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false">
                <span class="sr-only">Toggle navigation</span>
                <span aria-hidden="true">☰</span>
            </button>
            <div class="nav-links" id="primary-navigation">
                <a href="/home#welcome">Home</a>
                <a href="/home#challenges">Challenges</a>
                <a href="/home#schedule">Schedule</a>
                <a href="/home#partners">Partners</a>
                <a href="/home#about-us">About Us</a>
                <a href="/home#faqs">FAQs</a>
                <button class="nav-search" id="search-btn" type="button">Search</button>
                <a href="/home#registration" class="btn btn-primary nav-register">Register Now</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>
        <div class="search-container">
            <div class="search-heading">
                <h2 id="search-title">Search the event</h2>
                <button class="icon-button" id="close-search" type="button" aria-label="Close search">&times;</button>
            </div>
            <div class="search-field">
                <input type="search" id="search-input" placeholder="Search tracks, partners, schedule..." autocomplete="off">
                <button class="clear-search" id="clear-search" type="button" aria-label="Clear search">&times;</button>
            </div>
            <div id="search-results" aria-live="polite"></div>
        </div>
    </div>

    <script src="/main.js" defer></script>
</body>
</html>
