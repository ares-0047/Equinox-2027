<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% if club %}{{ club.intro }}{% elif pagePath == '/register' %}Register for {{ config.EVENT_NAME }}, a 36-hour international hybrid hackathon hosted by {{ config.HOST_INSTITUTION }}.{% else %}{{ config.DESCRIPTION }}{% endif %}">
    <meta name="keywords" content="{{ config.KEYWORDS }}">
    <meta name="author" content="{{ config.HOST_INSTITUTION }}">
    <meta name="robots" content="{% if noIndex %}noindex, nofollow{% else %}index, follow{% endif %}">
    <link rel="canonical" href="{{ siteUrl }}{{ pagePath }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ config.EVENT_NAME }}">
    <meta property="og:title" content="{% if club %}{{ club.name }} | {{ config.EVENT_NAME }}{% elif pagePath == '/register' %}Register for {{ config.EVENT_NAME }}{% else %}{{ config.EVENT_NAME }} | International Hybrid Hackathon{% endif %}">
    <meta property="og:description" content="{% if club %}{{ club.intro }}{% else %}{{ config.DESCRIPTION }}{% endif %}">
    <meta property="og:url" content="{{ siteUrl }}{{ pagePath }}">
    <meta property="og:image" content="{{ siteUrl }}/equinox-header-logo.png">
    <meta property="og:image:alt" content="EQUINOX 2027 international hackathon">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if club %}{{ club.name }} | {{ config.EVENT_NAME }}{% elif pagePath == '/register' %}Register for {{ config.EVENT_NAME }}{% else %}{{ config.EVENT_NAME }} | International Hybrid Hackathon{% endif %}">
    <meta name="twitter:description" content="{% if club %}{{ club.intro }}{% else %}{{ config.DESCRIPTION }}{% endif %}">
    <meta name="twitter:image" content="{{ siteUrl }}/equinox-header-logo.png">
    <title>{{ config.EVENT_NAME }} | International Hybrid Hackathon</title>
    <meta name="theme-color" content="#f4f0e7">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Event",
                "@id": "{{ siteUrl }}/home#event",
                "name": "{{ config.EVENT_NAME }}",
                "description": "{{ config.DESCRIPTION }}",
                "url": "{{ siteUrl }}/home",
                "image": ["{{ siteUrl }}/equinox-header-logo.png"],
                "startDate": "2027-02-24T00:00:00+05:30",
                "endDate": "2027-02-25T12:00:00+05:30",
                "eventStatus": "https://schema.org/EventScheduled",
                "eventAttendanceMode": "https://schema.org/MixedEventAttendanceMode",
                "location": {
                    "@type": "Place",
                    "name": "Shyamji Auditorium, Quantum University",
                    "address": {
                        "@type": "PostalAddress",
                        "streetAddress": "Quantum University",
                        "addressLocality": "Roorkee",
                        "addressRegion": "Uttarakhand",
                        "addressCountry": "IN"
                    }
                },
                "organizer": {
                    "@type": "CollegeOrUniversity",
                    "name": "{{ config.HOST_INSTITUTION }}",
                    "url": "{{ siteUrl }}"
                }
            },
            {
                "@type": "Organization",
                "@id": "{{ siteUrl }}/#organization",
                "name": "{{ config.HOST_INSTITUTION }}",
                "url": "{{ siteUrl }}"
            },
            {
                "@type": "WebSite",
                "@id": "{{ siteUrl }}/#website",
                "name": "{{ config.EVENT_NAME }}",
                "url": "{{ siteUrl }}",
                "description": "{{ config.DESCRIPTION }}"
            }
        ]
    }
    </script>
    <link rel="preload" as="image" href="/equinox-header-logo.png">
    <link rel="preload" as="image" href="/qtm-logo.png">
    <link rel="preload" as="image" href="/qtm-logo.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar" aria-label="Primary navigation">
        <div class="container nav-container">
            <a href="/home#welcome" class="nav-brand nav-brand-logo" aria-label="Equinox 2027 home"><img src="/equinox-header-logo.png" alt="EQUINOX 2027"></a>
            <button class="menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false">
                <span class="sr-only">Toggle navigation</span>
                <span aria-hidden="true">☰</span>
            </button>
            <div class="nav-links" id="primary-navigation">
                <a href="/home#welcome">Home</a>
                <a href="/home#challenges">Challenges</a>
                <a href="/home#schedule">Schedule</a>
                <a href="/home#partners">Partners</a>
                <a href="/home#about-us">About Us</a>
                <a href="/home#faqs">FAQs</a>
                <button class="nav-search" id="search-btn" type="button">Search</button>
                <a href="/home#registration" class="btn btn-primary nav-register">Register Now</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>
        <div class="search-container">
            <div class="search-heading">
                <h2 id="search-title">Search the event</h2>
                <button class="icon-button" id="close-search" type="button" aria-label="Close search">&times;</button>
            </div>
            <div class="search-field">
                <input type="search" id="search-input" placeholder="Search tracks, partners, schedule..." autocomplete="off">
                <button class="clear-search" id="clear-search" type="button" aria-label="Clear search">&times;</button>
            </div>
            <div id="search-results" aria-live="polite"></div>
        </div>
    </div>

    <script src="/main.js" defer></script>
</body>
</html>
